services:
  postgres:
    image: postgres:16-alpine
    container_name: faizan-brothers-ems-postgres
    environment:
      POSTGRES_DB: faizan_brothers_ems
      POSTGRES_USER: ems_user
      POSTGRES_PASSWORD: change_me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ems_user -d faizan_brothers_ems"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
