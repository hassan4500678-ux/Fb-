name: Build APK

on:
  push:
    branches: [babar-stats-app]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk BabarAzamStatsBook.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BabarAzamStatsBook
          path: BabarAzamStatsBook.apk

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete babar-stats-app-latest --yes --cleanup-tag || true
          gh release create babar-stats-app-latest BabarAzamStatsBook.apk --target babar-stats-app \
            --title "Babar Azam Stats Book (build ${{ github.run_number }})" \
            --notes "Download BabarAzamStatsBook.apk below and install it on your Android phone. Inside the app, tap Update to get new changes without reinstalling."
