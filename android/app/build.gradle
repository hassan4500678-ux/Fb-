plugins { id "com.android.application" }

def ksFile = file(System.getenv("KEYSTORE_PATH") ?: "release.jks")

android {
    namespace "com.hassan.babarstats"
    compileSdk 34
    defaultConfig {
        applicationId "com.hassan.babarstats"
        minSdk 24
        targetSdk 34
        versionCode((System.getenv("GITHUB_RUN_NUMBER") ?: "1") as int)
        versionName "1." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0")
    }
    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile ksFile
                storePassword System.getenv("KEYSTORE_PASSWORD") ?: "babarstats56"
                keyAlias "babar"
                keyPassword System.getenv("KEYSTORE_PASSWORD") ?: "babarstats56"
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig ksFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }
    sourceSets { main { assets.srcDirs = ["../../www"] } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies { implementation "androidx.webkit:webkit:1.11.0" }
